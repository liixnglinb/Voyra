<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Zenew 收款确认</title>
<style>
  :root{--bg:#0A0A0A;--fg:#F5F5F5;--muted:#8A8A8A;--line:#1F1F1F;--card:#121212;--gold:#C9A227;--gold-soft:#FFE08A;--mono:ui-monospace,Menlo,monospace;--sans:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;padding:40px 18px 80px}
  .wrap{max-width:900px;margin:0 auto}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
  h1{font-size:28px;font-weight:600;margin:10px 0 4px;letter-spacing:-.02em}
  .muted{color:var(--muted);font-size:13.5px}
  input{background:#0E0E0E;border:1px solid var(--line);border-radius:999px;padding:12px 18px;color:var(--fg);font-family:var(--sans);font-size:14px;outline:none;width:100%}
  input:focus{border-color:var(--gold)}
  .btn{background:#F5F5F5;color:#0A0A0A;border:none;border-radius:999px;padding:11px 22px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:var(--sans)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:14px}
  .ord{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  .no{font-family:var(--mono);font-size:16px;color:var(--gold-soft);letter-spacing:.04em}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tag{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
  .ok{color:#7BD88F}.code{font-family:var(--mono);color:var(--gold-soft);letter-spacing:.08em}
  .sec{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:30px 0 4px}
  .empty{color:var(--muted);font-size:13.5px;padding:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">ZENEW / 收款确认</div>
  <h1>订单确认台</h1>
  <div class="muted">确认收款后：订单填了邮箱且该邮箱已注册 → 额度自动充入；否则自动签发兑换码让用户自己兑换。</div>

  <div class="row" style="margin-top:20px">
    <input id="tok" type="password" placeholder="管理口令" style="max-width:320px" />
    <button class="btn" id="save">保存并加载</button>
    <button class="btn ghost" id="reload">刷新</button>
  </div>
  <div class="muted" id="msg" style="margin-top:10px"></div>

  <div class="sec">待确认</div>
  <div id="pending"></div>

  <div class="sec">已支付（最近 20）</div>
  <div id="paid"></div>
</div>

<script>
const API = 'https://zenew-api.lxlrwxs.top';
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('zenew_admin_token') || '';
$('tok').value = token;

const money = (n) => '¥' + Number(n).toFixed(2);
const wan = (n) => (n/10000).toFixed(0) + ' 万';

async function api(path, opt = {}) {
  const r = await fetch(API + path, {
    ...opt,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(opt.headers || {}) },
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}

async function load() {
  if (!token) { $('msg').textContent = '请先填管理口令'; return; }
  $('msg').innerHTML = '<span class="muted">加载中…</span>';
  try {
    const p = await api('/admin/orders?status=pending');
    const q = await api('/admin/orders?status=paid');
    $('msg').innerHTML = `<span class="ok">已连接</span> · 待确认 ${p.orders.length} 单`;
    render('pending', p.orders, true);
    render('paid', q.orders.slice(0, 20), false);
  } catch (e) {
    $('msg').innerHTML = '<span style="color:#F0736A">' + e.message + '</span>';
  }
}

function render(boxId, orders, withBtn) {
  const box = $(boxId);
  if (!orders.length) { box.innerHTML = '<div class="empty">暂无订单</div>'; return; }
  box.innerHTML = '';
  orders.forEach(o => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="ord">
        <div>
          <div class="no">${o.order_no}</div>
          <div class="meta">${o.tier} 档 · ${money(o.price_cny)} · ${wan(o.tokens)} tokens · ${o.email || '未填邮箱'} · ${new Date(o.created_at).toLocaleString('zh-CN')}</div>
        </div>
        <div class="row">
          ${o.status === 'paid'
            ? `<span class="tag">已支付</span>${o.credited ? '<span class="tag ok">已充入账号</span>' : (o.code ? `<span class="code">${o.code}</span>` : '')}<button class="btn ghost" data-copy="${o.code || ''}">复制码</button>`
            : `<span class="tag">待确认</span><button class="btn" data-no="${o.order_no}">确认收款</button>`}
        </div>
      </div>`;
    box.appendChild(el);
  });
}

document.addEventListener('click', async (e) => {
  const no = e.target.dataset?.no;
  const cp = e.target.dataset?.copy;
  if (no) {
    if (!confirm('确认已收到订单 ' + no + ' 的款项？')) return;
    e.target.disabled = true; e.target.textContent = '处理中…';
    try {
      const d = await api('/admin/orders/' + no + '/confirm', { method: 'POST', body: '{}' });
      alert(d.credited ? '已自动充入该邮箱账号 ✓' : ('已签发兑换码：' + d.code));
      load();
    } catch (err) { alert('失败：' + err.message); e.target.disabled = false; e.target.textContent = '确认收款'; }
  }
  if (cp) { navigator.clipboard.writeText(cp); e.target.textContent = '已复制 ✓'; setTimeout(() => e.target.textContent = '复制码', 1500); }
});

$('save').onclick = () => { token = $('tok').value.trim(); localStorage.setItem('zenew_admin_token', token); load(); };
$('reload').onclick = load;
if (token) load();
</script>
</body>
</html>
