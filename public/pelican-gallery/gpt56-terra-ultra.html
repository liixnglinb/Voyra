<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="model" content="gpt 5.6 Terra ultra">
  <meta name="description" content="A self-contained 2D SVG animation of a pelican riding a bicycle.">
  <title>Pelican Bicycle Parade</title>
  <!-- Generated with model: gpt 5.6 Terra ultra -->
  <style>
    :root {
      --ink: #15324a;
      --muted: #597388;
      --panel: #ffffff;
      --sky: #c9eff8;
      --sun: #ffd477;
      --coral: #ed735d;
      --teal: #2d9a9d;
      --wheel: #213e52;
      --speed: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: #eaf4f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .scene-card {
      width: min(1100px, 100%);
      overflow: hidden;
      border: 1px solid rgba(21, 50, 74, .12);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(21, 50, 74, .16);
    }

    .scene-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(21, 50, 74, .1);
    }

    .title-block { min-width: 0; }
    h1 { margin: 0; font-size: clamp(18px, 2.2vw, 25px); letter-spacing: .01em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .model-tag {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      color: #155c62;
      background: #dff4f2;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stage-wrap { padding: 18px; background: #f6fbfb; }
    .stage {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: var(--sky);
      box-shadow: inset 0 0 0 1px rgba(21, 50, 74, .12);
    }

    svg { display: block; width: 100%; height: auto; }
    .stroke-round { stroke-linecap: round; stroke-linejoin: round; }

    .animated { transform-box: fill-box; transform-origin: center; }
    .ride-bob { animation: ride-bob calc(.9s / var(--speed)) ease-in-out infinite; }
    .wing-flap { transform-origin: 492px 277px; animation: wing-flap calc(.95s / var(--speed)) ease-in-out infinite; }
    .wheel-spin { transform-origin: center; animation: wheel-spin calc(1.15s / var(--speed)) linear infinite; }
    .crank-spin { transform-origin: 465px 398px; animation: wheel-spin calc(.9s / var(--speed)) linear infinite; }
    .leg-pump { transform-origin: 463px 350px; animation: leg-pump calc(.9s / var(--speed)) ease-in-out infinite; }
    .cloud-drift { animation: cloud-drift calc(18s / var(--speed)) linear infinite; }
    .road-drift { animation: road-drift calc(2.7s / var(--speed)) linear infinite; }
    .tail-sway { transform-origin: 405px 280px; animation: tail-sway calc(1.2s / var(--speed)) ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.8s ease-in-out infinite; }

    @keyframes ride-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(1deg); }
      50% { transform: rotate(-11deg) translateY(-2px); }
    }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes leg-pump {
      0%, 100% { transform: rotate(-7deg); }
      50% { transform: rotate(11deg); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-120px); }
      to { transform: translateX(980px); }
    }

    @keyframes road-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }

    @keyframes tail-sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes blink {
      0%, 45%, 49%, 100% { transform: scaleY(1); }
      47%, 48% { transform: scaleY(.12); }
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px 17px;
    }

    .control-group { display: flex; gap: 9px; }
    button {
      border: 1px solid rgba(21, 50, 74, .18);
      border-radius: 9px;
      padding: 8px 12px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }

    button:hover { border-color: var(--teal); background: #f0fbfa; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid rgba(45, 154, 157, .28); outline-offset: 2px; }
    .status { color: var(--muted); font-size: 12px; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .scene-header { align-items: flex-start; flex-direction: column; padding: 15px; }
      .stage-wrap { padding: 10px; }
      .controls { align-items: flex-start; flex-direction: column; padding: 12px 10px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .animated, .cloud-drift, .road-drift, .blink { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <main class="scene-card">
    <header class="scene-header">
      <div class="title-block">
        <h1>Pelican Bicycle Parade</h1>
        <p class="subtitle">A hand-drawn SVG loop with a little seaside momentum.</p>

      <span class="model-tag">Model: gpt 5.6 Terra ultra</span>

              <rect x="0" y="17" width="57" height="19" rx="9" />
            </g>
            <g transform="translate(420 132) scale(.78)">
              <circle cx="0" cy="16" r="20" /><circle cx="24" cy="2" r="29" /><circle cx="57" cy="17" r="19" />
              <rect x="0" y="17" width="57" height="19" rx="9" />
            </g>
          </g>

          <path d="M0 300 C145 246 246 269 364 307 C484 346 592 330 710 275 C812 228 891 241 960 272 L960 402 L0 402 Z" fill="#9bc7a0" opacity=".65" />
          <path d="M0 334 C133 288 270 304 386 341 C522 384 640 351 753 309 C840 277 907 282 960 302 L960 410 L0 410 Z" fill="#6da795" />
          <path d="M0 365 C126 342 240 351 361 380 C495 412 609 392 738 351 C826 324 901 326 960 342 L960 420 L0 420 Z" fill="url(#sea-gradient)" />

          <g fill="none" stroke="#c7f0e8" stroke-width="4" stroke-linecap="round" opacity=".58">
            <path d="M48 370 C94 355 139 355 186 369" /><path d="M720 365 C757 352 800 351 844 362" />
            <path d="M782 385 C822 373 859 373 895 384" /><path d="M202 391 C248 378 294 379 338 391" />
          </g>

          <rect y="400" width="960" height="140" fill="#e8d8b8" />
          <path d="M0 400 H960 V540 H0 Z" fill="#e8d8b8" />
          <path d="M0 425 H960" stroke="#d3bd98" stroke-width="5" opacity=".65" />
          <g class="road-drift" fill="#fff4d8" opacity=".86">
            <rect x="10" y="477" width="84" height="9" rx="4.5" /><rect x="188" y="477" width="84" height="9" rx="4.5" />
            <rect x="366" y="477" width="84" height="9" rx="4.5" /><rect x="544" y="477" width="84" height="9" rx="4.5" />
            <rect x="722" y="477" width="84" height="9" rx="4.5" /><rect x="900" y="477" width="84" height="9" rx="4.5" />
          </g>

          <g opacity=".75" fill="#387b68">
            <path d="M100 402 l-6 -25 l13 9 l12 -19 l2 35 z" /><path d="M854 404 l-4 -28 l12 11 l13 -18 l1 36 z" />
          </g>

          <g class="ride-bob" filter="url(#soft-shadow)">
            <!-- bicycle -->
            <g stroke="#213e52" stroke-width="7" fill="none" class="stroke-round">
              <circle cx="364" cy="399" r="67" fill="#f5fbfa" stroke-width="8" />
              <circle cx="568" cy="399" r="67" fill="#f5fbfa" stroke-width="8" />
            </g>

                <path d="M0 -59 V59 M-59 0 H59 M-42 -42 L42 42 M42 -42 L-42 42" />

              <path d="M424 326 L407 300" /><path d="M396 299 H430" />

            </g>
            <path d="M397 300 Q415 291 431 300" fill="none" stroke="#213e52" stroke-width="10" stroke-linecap="round" />
            <circle cx="465" cy="399" r="15" fill="#ffd477" stroke="#213e52" stroke-width="5" />
            <g class="crank-spin" stroke="#213e52" stroke-width="5" stroke-linecap="round">
              <path d="M465 399 L492 418" /><path d="M465 399 L441 377" />

      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <button id="toggle" type="button" aria-pressed="false">Pause animation</button>
        <button id="replay" type="button">Replay</button>
      </div>
      <span class="status" id="status" aria-live="polite">Rolling along the coast</span>
    </div>
  </main>

  <script>
    (function () {
      const scene = document.getElementById('pelican-scene');
      const toggle = document.getElementById('toggle');
      const replay = document.getElementById('replay');
      const status = document.getElementById('status');
      let paused = false;

      function setPaused(next) {
        paused = next;
        scene.style.setProperty('animation-play-state', paused ? 'paused' : 'running');
        document.querySelectorAll('.animated, .cloud-drift, .road-drift, .blink').forEach(function (element) {
          element.style.animationPlayState = paused ? 'paused' : 'running';
        });
        toggle.textContent = paused ? 'Resume animation' : 'Pause animation';
        toggle.setAttribute('aria-pressed', String(paused));
        status.textContent = paused ? 'Animation paused' : 'Rolling along the coast';
      }

      toggle.addEventListener('click', function () { setPaused(!paused); });
      replay.addEventListener('click', function () {
        const animated = document.querySelectorAll('.animated, .cloud-drift, .road-drift, .blink');
        animated.forEach(function (element) { element.style.animation = 'none'; });
        void scene.offsetWidth;
        animated.forEach(function (element) { element.style.animation = ''; });
        setPaused(false);
        status.textContent = 'Back in motion';
      });
    }());
  </script>
</body>
</html>
