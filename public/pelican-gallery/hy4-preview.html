<script>
(function(){
  const $ = id => document.getElementById(id);
  const scene = $('scene');

  // ---------- 几何常量 ----------
  const BB    = {x:655, y:400};     // 五通（中轴）
  const HIP   = {x:612, y:312};     // 髋关节
  const CRANK = 44;                 // 曲柄长
  const L1 = 76, L2 = 76;           // 大腿 / 小腿
  const WHEEL_R = 62;
  const GEAR = 2.2;                 // 曲柄转 1 圈，车轮转 2.2 圈

  // ---------- 状态 ----------
  let speed = 1, paused = false, last = 0;
  let wheelDeg = 0, dist = 0, t = 0;

  // ---------- 元素 ----------
  const wheelRear = $('wheelRear'), wheelFront = $('wheelFront');
  const crankNear = $('crankNear'), crankFar = $('crankFar');
  const nearThigh = $('nearThigh'), nearShin = $('nearShin'), nearFoot = $('nearFoot');
  const farThigh  = $('farThigh'),  farShin  = $('farShin'),  farFoot  = $('farFoot');
  const rig = $('rig'), pelican = $('pelican'), wing = $('wing'), head = $('head');
  const neck = $('neck'), pouch = $('pouch'), fish = $('fish'), shadow = $('shadow');
  const chainUp = $('chainUp'), chainLo = $('chainLo');
  const scrollHills = $('scroll-hills'), scrollTrees = $('scroll-trees'), scrollDash = $('scroll-dash');
  const clouds = Array.from(document.querySelectorAll('.cloud'));
  const speedlines = $('speedlines');
  const sls = Array.from(document.querySelectorAll('.sl'));
  const rib1 = $('rib1'), rib2 = $('rib2');

  // ---------- 两骨节反向运动学（膝朝前） ----------
  function ik(hx, hy, fx, fy, l1, l2){
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy) || 0.001;
    const dClamp = Math.min(l1 + l2 - 0.01, Math.max(Math.abs(l1 - l2) + 0.01, d));
    const ux = dx / d, uy = dy / d;         // 髋→踝 单位向量
    const a  = (l1*l1 - l2*l2 + dClamp*dClamp) / (2*dClamp);
    const h  = Math.sqrt(Math.max(0, l1*l1 - a*a));
    const px = uy, py = -ux;                // 垂直向量：使膝盖落在身体前方
    return { kx: hx + ux*a + px*h, ky: hy + uy*a + py*h };
  }

  function setLeg(thigh, shin, foot, fx, fy, hip){
    const k = ik(hip.x, hip.y, fx, fy, L1, L2);
    thigh.setAttribute('x1', hip.x); thigh.setAttribute('y1', hip.y);
    thigh.setAttribute('x2', k.kx);  thigh.setAttribute('y2', k.ky);
    shin.setAttribute('x1', k.kx);   shin.setAttribute('y1', k.ky);
    shin.setAttribute('x2', fx);     shin.setAttribute('y2', fy);
    const ang = Math.atan2(fy - k.ky, fx - k.kx) * 180 / Math.PI;
    foot.setAttribute('transform', `translate(${fx.toFixed(2)},${fy.toFixed(2)}) rotate(${ang.toFixed(2)})`);
  }

  // ---------- 背景滚动 ----------
  function setScroll(g, offset, period){
    const m = ((offset % period) + period) % period;
    const u = g.children;
    u[0].setAttribute('transform', `translate(${-m},0)`);
    u[1].setAttribute('transform', `translate(${period - m},0)`);
  }

  // 初始化速度线
  sls.forEach((l, i) => { l._x = 1000 + i * 260; l._y = Number(l.getAttribute('y1')); l._len = 60 + i * 22; });

  // ---------- 主循环 ----------
  function frame(ts){
    if (!last) last = ts;
    let dt = (ts - last) / 1000; last = ts;
    if (dt > 0.05) dt = 0.05;
    if (!paused){
      t += dt * speed;
      dist += 260 * speed * dt;                       // 前进距离（像素）
      wheelDeg += (260 * speed / WHEEL_R) * 180 / Math.PI * dt * -1; // 前滚 = 顺时针
    }

    const crankRad = (wheelDeg * Math.PI / 180) / GEAR;
    const v = 260 * speed;

    // 车轮
    wheelRear.setAttribute('transform',  `rotate(${wheelDeg.toFixed(2)} 540 400)`);
    wheelFront.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 790 400)`);

    // 曲柄（两端相差 180°）
    crankNear.setAttribute('transform', `rotate(${(crankRad*180/Math.PI).toFixed(2)} 655 400)`);
    crankFar.setAttribute('transform',  `rotate(${(crankRad*180/Math.PI + 180).toFixed(2)} 655 400)`);

    // 踏板位置 → 双腿 IK
    const nearA = crankRad, farA = crankRad + Math.PI;
    const nf = { x: BB.x + CRANK*Math.cos(nearA), y: BB.y + CRANK*Math.sin(nearA) };
    const ff = { x: BB.x + CRANK*Math.cos(farA),  y: BB.y + CRANK*Math.sin(farA) };

    // 身体随踩踏上下颠簸
    const bob = Math.sin(2*crankRad) * 2.4;
    rig.setAttribute('transform', `translate(0,${bob.toFixed(2)})`);

    // 髋部跟随车身颠簸（世界坐标 = 局部 + bob）
    const hipNow = { x: HIP.x, y: HIP.y + bob };
    const hipFar = { x: HIP.x - 6, y: HIP.y + bob };
    setLeg(nearThigh, nearShin, nearFoot, nf.x, nf.y, hipNow);
    setLeg(farThigh,  farShin,  farFoot,  ff.x, ff.y, hipFar);

    // 身体 / 翅膀 / 头部 的细微联动
    pelican.setAttribute('transform', `rotate(${(Math.sin(2*crankRad)*1.1).toFixed(2)} 600 300)`);
    wing.setAttribute('transform', `rotate(${(Math.sin(2*crankRad + 0.6)*7).toFixed(2)} 566 250)`);
    head.setAttribute('transform', `translate(0,${(Math.sin(2*crankRad + 1.2)*2.2).toFixed(2)}) rotate(${(Math.sin(crankRad)*1.6).toFixed(2)} 690 200)`);
    neck.setAttribute('d', `M636,244 C676,${(238 + Math.sin(2*crankRad)*2).toFixed(1)} 682,214 692,196`);

    // 喉囊抖动 + 鱼尾摆动（只有前进时才晃）
    const wob = Math.sin(t*7) * 2.2 * (paused ? 0 : 1);
    pouch.setAttribute('transform', `translate(0,${wob.toFixed(2)})`);
    fish.setAttribute('transform', `translate(772,244) rotate(${(Math.sin(t*5)*16 - 18).toFixed(2)})`);

    // 链条传动
    const chainOff = -dist * 0.9;
    chainUp.setAttribute('stroke-dashoffset', chainOff.toFixed(1));
    chainLo.setAttribute('stroke-dashoffset', (-chainOff).toFixed(1));

    // 背景视差
    setScroll(scrollHills, dist * 0.18, 960);
    setScroll(scrollTrees, dist * 0.62, 960);
    setScroll(scrollDash,  dist * 1.00, 970);

    clouds.forEach(c => {
      const vx = Number(c.dataset.v);
      let x = (Number(c.dataset.x) - dist * 0.06 * vx / 10) % 1180;
      if (x < -180) x += 1180;
      c.dataset.x = x;
      c.setAttribute('transform', `translate(${x.toFixed(1)},${c.dataset.y}) scale(${c.dataset.s})`);
    });

    // 飘带
    const flap = Math.sin(t*11) * 6;
    rib1.setAttribute('d', `M796,300 C816,${296 + flap} 830,${306 - flap} 846,${300 + flap*0.6}`);
    rib2.setAttribute('d', `M796,306 C818,${306 - flap} 828,${316 + flap} 850,${310 - flap*0.6}`);

    // 速度线
    const slAlpha = Math.max(0, Math.min(0.55, (speed - 1.1) * 0.5));
    speedlines.setAttribute('opacity', paused ? 0 : slAlpha.toFixed(3));
    if (!paused){
      sls.forEach(l => {
        l._x -= v * 2.1 * dt;
        if (l._x < -220){ l._x = 1000 + Math.random()*500; l._y = 90 + Math.random()*400; }
        l.setAttribute('x1', l._x.toFixed(1));
        l.setAttribute('x2', (l._x + l._len).toFixed(1));
        l.setAttribute('y1', l._y.toFixed(1));
        l.setAttribute('y2', l._y.toFixed(1));
      });
    }

    // 影子随颠簸轻微缩放
    shadow.setAttribute('rx', (150 - bob*3).toFixed(1));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 控件 ----------
  const btnPlay = $('btnPlay'), btnNight = $('btnNight'), spd = $('spd'), spdVal = $('spdVal');
  btnPlay.addEventListener('click', () => {
    paused = !paused;
    btnPlay.textContent = paused ? '继续' : '暂停';
  });
  spd.addEventListener('input', () => {
    speed = Number(spd.value);
    spdVal.textContent = speed.toFixed(2) + '×';
  });
  btnNight.addEventListener('click', () => {
    document.body.classList.toggle('night');
    btnNight.textContent = document.body.classList.contains('night') ? '切换白天' : '切换夜晚';
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); btnPlay.click(); }
  });
})();
</script>
</body>
</html>
