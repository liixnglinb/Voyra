    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d1117;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .scene-wrapper { width: 95vmin; max-width: 960px; }
        svg { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .model-tag { margin-top: 14px; color: #8b949e; font-size: 13px; text-align: center; letter-spacing: .5px; }
        .model-tag span { color: #58a6ff; font-weight: 600; }

        /* ===== Keyframes ===== */

        @keyframes wheelSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        @keyframes pedalSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        @keyframes bodyBob   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
        @keyframes wingFlap  { 0%,100%{transform:rotate(0deg)} 35%{transform:rotate(-12deg)} 70%{transform:rotate(4deg)} }
        @keyframes cloudDrift{ from{transform:translateX(0)} to{transform:translateX(-1100px)} }
        @keyframes dashScroll{ from{transform:translateX(0)} to{transform:translateX(-80px)} }
        @keyframes pouchWobble{ 0%,100%{transform:scaleY(1) scaleX(1)} 50%{transform:scaleY(1.14) scaleX(.95)} }
        @keyframes eyeBlink  { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)} }
        @keyframes speedWhoosh{ 0%{transform:translateX(0);opacity:.55} 100%{transform:translateX(-130px);opacity:0} }
        @keyframes fishWiggle{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(5deg)} 75%{transform:rotate(-5deg)} }
        @keyframes dustDrift { 0%{transform:translate(0,0);opacity:.45} 100%{transform:translate(-45px,-18px);opacity:0} }
        @keyframes tailWag   { 0%,100%{transform:rotate(0)} 50%{transform:rotate(6deg)} }

        /* ===== Animation classes ===== */

        .wheel-rear   { animation: wheelSpin 1.2s linear infinite; transform-origin: 280px 430px; }
        .wheel-front  { animation: wheelSpin 1.2s linear infinite; transform-origin: 560px 430px; }
        .pedal-group  { animation: pedalSpin 1.2s linear infinite; transform-origin: 345px 425px; }
        .pelican-group{ animation: bodyBob .6s ease-in-out infinite; }
        .wing-anim    { animation: wingFlap 2s ease-in-out infinite; transform-origin: 348px 308px; }
        .cloud-l1     { animation: cloudDrift 26s linear infinite; }
        .cloud-l2     { animation: cloudDrift 36s linear infinite; animation-delay:-14s; }
        .cloud-l3     { animation: cloudDrift 32s linear infinite; animation-delay:-22s; }
        .road-marks   { animation: dashScroll .4s linear infinite; }
        .beak-pouch   { animation: pouchWobble 1.2s ease-in-out infinite; transform-origin: 548px 248px; }
        .pelican-eye  { animation: eyeBlink 3.5s ease-in-out infinite; transform-origin: 506px 215px; }
        .whoosh-1     { animation: speedWhoosh .55s linear infinite; }
        .whoosh-2     { animation: speedWhoosh .55s linear infinite .18s; }
        .whoosh-3     { animation: speedWhoosh .55s linear infinite .36s; }
        .basket-fish  { animation: fishWiggle .9s ease-in-out infinite; transform-origin: 548px 292px; }
        .dust-1       { animation: dustDrift 1s ease-out infinite; }
        .dust-2       { animation: dustDrift 1s ease-out infinite .3s; }
        .dust-3       { animation: dustDrift 1s ease-out infinite .6s; }
        .tail-wag     { animation: tailWag .8s ease-in-out infinite; transform-origin: 245px 328px; }
    </style>
</head>
