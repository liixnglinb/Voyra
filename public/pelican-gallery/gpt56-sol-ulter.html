    <div class="control-dock" role="group" aria-label="Animation controls">
      <button id="motion-toggle" class="motion-toggle" type="button" aria-label="Pause animation" title="Pause animation">
        <span class="pause-glyph" aria-hidden="true"></span>
        <span class="play-glyph" aria-hidden="true"></span>
        <span class="sr-only">Pause or play</span>
      </button>
      <div class="speed-control" role="group" aria-label="Animation speed">
        <span class="speed-label" aria-hidden="true">Speed</span>
        <button class="speed-button" type="button" data-speed="0.65" aria-pressed="false" title="Leisurely speed">0.65x</button>
        <button class="speed-button" type="button" data-speed="1" aria-pressed="true" title="Cruising speed">1x</button>
        <button class="speed-button" type="button" data-speed="1.45" aria-pressed="false" title="Tailwind speed">1.45x</button>
      </div>
    </div>

    <div class="model-credit" aria-label="Model used: gpt 5.6 sol Ulter">
      <span class="credit-label">Model</span>
      <span class="credit-value">gpt 5.6 sol Ulter</span>
    </div>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("artwork");
      const stage = document.querySelector(".scene");
      const motionToggle = document.getElementById("motion-toggle");
      const speedButtons = [...document.querySelectorAll(".speed-button")];
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const parts = {
        ride: document.getElementById("bike-ride"),
        rearWheel: document.getElementById("rear-wheel"),
        frontWheel: document.getElementById("front-wheel"),
        crank: document.getElementById("crank"),
        riderUpper: document.getElementById("rider-upper"),
        wing: document.getElementById("wing"),
        head: document.getElementById("head-tilt"),
        scarfTail: document.getElementById("scarf-tail"),
        frontUpper: document.getElementById("front-upper"),
        frontLower: document.getElementById("front-lower"),
        frontKnee: document.getElementById("front-knee"),
        frontFoot: document.getElementById("front-foot"),
        backUpper: document.getElementById("back-upper"),
        backLower: document.getElementById("back-lower"),
        backKnee: document.getElementById("back-knee"),
        backFoot: document.getElementById("back-foot"),
        sunRays: document.getElementById("sun-rays"),
        seaPattern: document.getElementById("sea-pattern"),
        lanePattern: document.getElementById("lane-pattern"),
        roadPattern: document.getElementById("road-speckle"),
        grassPattern: document.getElementById("grass-pattern")
      };

      const clouds = [...document.querySelectorAll(".cloud")];
      const roadside = [...document.querySelectorAll(".roadside")];
      const state = {
        running: !prefersReducedMotion.matches,
        speed: 1,
        time: 0,
        lastFrame: performance.now(),
        bikeScale: 1,
        bikeLift: 0
      };

      const radians = Math.PI / 180;
      const format = value => Number(value.toFixed(2));

      function wrap(value, min, max) {
        const range = max - min;
        return ((value - min) % range + range) % range + min;
      }

      function solveLeg(hip, foot, upperLength, lowerLength, bend, nodes) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const rawDistance = Math.hypot(dx, dy);
        const distance = Math.min(Math.max(rawDistance, 1), upperLength + lowerLength - 0.5);
        const along = (upperLength * upperLength - lowerLength * lowerLength + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upperLength * upperLength - along * along));
        const unitX = dx / rawDistance;
        const unitY = dy / rawDistance;
        const baseX = hip.x + unitX * along;
        const baseY = hip.y + unitY * along;
        const knee = {
          x: baseX - unitY * height * bend,
          y: baseY + unitX * height * bend
        };

        nodes.upper.setAttribute("d", `M${format(hip.x)} ${format(hip.y)} L${format(knee.x)} ${format(knee.y)}`);
        nodes.lower.setAttribute("d", `M${format(knee.x)} ${format(knee.y)} L${format(foot.x)} ${format(foot.y)}`);
        nodes.knee.setAttribute("cx", format(knee.x));
        nodes.knee.setAttribute("cy", format(knee.y));
        nodes.foot.setAttribute("d", `M${format(foot.x - 13)} ${format(foot.y + 1)} Q${format(foot.x + 7)} ${format(foot.y - 7)} ${format(foot.x + 34)} ${format(foot.y + 2)}`);
      }

      function fitScene() {
        const bounds = stage.getBoundingClientRect();
        const ratio = bounds.width / Math.max(bounds.height, 1);
        const viewWidth = 900 * ratio;
        const centerX = 825;
        const viewX = centerX - viewWidth / 2;
        state.bikeScale = Math.min(1, Math.max(0.4, viewWidth / 820));
        state.bikeLift = bounds.width <= 680
          ? Math.max(0, (66 - bounds.height * 0.12) * 900 / Math.max(bounds.height, 1))
          : 0;
        svg.setAttribute("viewBox", `${format(viewX)} 0 ${format(viewWidth)} 900`);
        renderScene(state.time);
      }

      function renderScene(time) {
        const pedalPhase = time * Math.PI * 2 / 1.08;
        const pedalDegrees = pedalPhase / radians;
        const travel = time * 315;
        const wheelDegrees = travel / 132 / radians;
        const bob = Math.sin(pedalPhase * 2) * 3.8;
        const lean = Math.sin(pedalPhase) * 0.65;
        const bodyBob = Math.sin(pedalPhase * 2 + 0.55) * 2.5;

        parts.ride.setAttribute(
          "transform",
          `translate(0 ${format(bob - state.bikeLift)}) translate(825 792) scale(${format(state.bikeScale)}) translate(-825 -792) rotate(${format(lean)} 825 660)`
        );
        parts.rearWheel.setAttribute("transform", `translate(610 660) rotate(${format(wheelDegrees)})`);
        parts.frontWheel.setAttribute("transform", `translate(1040 660) rotate(${format(wheelDegrees)})`);
        parts.crank.setAttribute("transform", `translate(800 645) rotate(${format(pedalDegrees)})`);
        parts.riderUpper.setAttribute("transform", `translate(0 ${format(bodyBob)}) rotate(${format(-lean * 0.7)} 735 470)`);
        parts.wing.setAttribute("transform", `rotate(${format(Math.sin(pedalPhase + 0.9) * 2.8)} 741 354)`);
        parts.head.setAttribute("transform", `rotate(${format(Math.sin(pedalPhase * 0.5) * 1.4)} 900 228)`);
        parts.sunRays.setAttribute("transform", `rotate(${format(time * 2.5)})`);

        const scarfWaveA = Math.sin(pedalPhase * 1.3) * 14;
        const scarfWaveB = Math.cos(pedalPhase * 1.7) * 10;
        parts.scarfTail.setAttribute(
          "d",
          `M639 292 C${format(585 + scarfWaveA)} ${format(270 + scarfWaveB)} ${format(545 - scarfWaveB)} ${format(300 - scarfWaveA * 0.25)} ${format(490 - scarfWaveA)} ${format(273 + scarfWaveB * 0.45)} C${format(530 + scarfWaveB)} ${format(318 + scarfWaveA * 0.25)} ${format(568 + scarfWaveA * 0.2)} ${format(327 - scarfWaveB * 0.3)} 626 318 Z`
        );

        const frontFoot = {
          x: 800 + Math.cos(pedalPhase) * 52,
          y: 645 + Math.sin(pedalPhase) * 38
        };
        const backFoot = {
          x: 800 + Math.cos(pedalPhase + Math.PI) * 52,
          y: 645 + Math.sin(pedalPhase + Math.PI) * 38
        };

        solveLeg(
          { x: 758, y: 447 },
          frontFoot,
          137,
          142,
          0.82,
          { upper: parts.frontUpper, lower: parts.frontLower, knee: parts.frontKnee, foot: parts.frontFoot }
        );
        solveLeg(
          { x: 704, y: 447 },
          backFoot,
          142,
          146,
          0.9,
          { upper: parts.backUpper, lower: parts.backLower, knee: parts.backKnee, foot: parts.backFoot }
        );

        parts.lanePattern.setAttribute("patternTransform", `translate(${format(-(travel % 300))} 0)`);
        parts.roadPattern.setAttribute("patternTransform", `translate(${format(-(travel * 0.62 % 92))} 0)`);
        parts.grassPattern.setAttribute("patternTransform", `translate(${format(-(travel * 1.18 % 220))} 0)`);
        parts.seaPattern.setAttribute("patternTransform", `translate(${format(-(travel * 0.08 % 190))} 0)`);

        clouds.forEach(cloud => {
          const baseX = Number(cloud.dataset.x);
          const baseY = Number(cloud.dataset.y);
          const speed = Number(cloud.dataset.speed);
          const scale = cloud.getAttribute("transform").match(/scale\(([^)]+)\)/)?.[1] || 1;
          const x = wrap(baseX - time * speed, -360, 2300);
          cloud.setAttribute("transform", `translate(${format(x)} ${baseY}) scale(${scale})`);
        });

        roadside.forEach(item => {
          const baseX = Number(item.dataset.x);
          const baseY = Number(item.dataset.y);
          const factor = Number(item.dataset.factor);
          const x = wrap(baseX - travel * factor, -420, 2660);
          item.setAttribute("transform", `translate(${format(x)} ${baseY})`);
        });
      }

      function updateToggle() {
        motionToggle.classList.toggle("is-paused", !state.running);
        motionToggle.setAttribute("aria-label", state.running ? "Pause animation" : "Play animation");
        motionToggle.title = state.running ? "Pause animation" : "Play animation";
      }

      function setRunning(running) {
        state.running = running;
        state.lastFrame = performance.now();
        updateToggle();
      }

      function tick(now) {
        const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
        state.lastFrame = now;
        if (state.running) {
          state.time += delta * state.speed;
          renderScene(state.time);
        }
        requestAnimationFrame(tick);
      }

      motionToggle.addEventListener("click", () => setRunning(!state.running));

      speedButtons.forEach(button => {
        button.addEventListener("click", () => {
          state.speed = Number(button.dataset.speed);
          speedButtons.forEach(option => option.setAttribute("aria-pressed", String(option === button)));
        });
      });

      window.addEventListener("keydown", event => {
        const activeTag = document.activeElement?.tagName;
        if (event.code === "Space" && activeTag !== "BUTTON" && activeTag !== "INPUT") {
          event.preventDefault();
          setRunning(!state.running);
        }
      });

      window.addEventListener("resize", fitScene, { passive: true });
      document.addEventListener("visibilitychange", () => {
        state.lastFrame = performance.now();
      });
      prefersReducedMotion.addEventListener?.("change", event => setRunning(!event.matches));

      fitScene();
      renderScene(0);
      updateToggle();
      requestAnimationFrame(tick);
    })();
  </script>
