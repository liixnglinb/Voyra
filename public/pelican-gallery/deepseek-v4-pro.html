  :root {

  body {

    flex-direction: column;
    align-items: center;

  }

  .stage {
    width: min(920px, 100%);
    background: var(--card-bg);
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(40, 70, 110, 0.22);
    overflow: hidden;
    padding: 8px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .caption {
    text-align: center;
    color: var(--ink);
  }

  .caption h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .caption p {
    margin: 6px 0 0;
    font-size: 14px;
    color: #5c7186;
  }

  .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 16px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #dbe6f0;
    color: #46607c;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .badge b { color: var(--accent); font-weight: 700; }

  /* ---------- 动画关键帧 ---------- */
  @keyframes spin   { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
  @keyframes crank  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
  @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes flap   { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(20deg); } }
  @keyframes legFront { 0%,100% { transform: rotate(-13deg); } 50% { transform: rotate(13deg); } }
  @keyframes legBack  { 0%,100% { transform: rotate(13deg); } 50% { transform: rotate(-13deg); } }
  @keyframes pouch  { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.09); } }
  @keyframes cloud1 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(46px); } }
  @keyframes cloud2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-38px); } }
  @keyframes sunPulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.12; } }

  .wheel, .crank, .leg, .wing, .pouch, .bob, .cloud {
    transform-box: view-box;
  }
  .wheel  { animation: spin 1.1s linear infinite; }
  .crank  { animation: crank 1.1s linear infinite; }
  .bob    { animation: bob 0.55s ease-in-out infinite; }
  .wing   { animation: flap 0.8s ease-in-out infinite; }
  .legF   { animation: legFront 1.1s ease-in-out infinite; }
  .legB   { animation: legBack 1.1s ease-in-out infinite; }
  .pouch  { animation: pouch 0.55s ease-in-out infinite; }
  .cloudA { animation: cloud1 9s ease-in-out infinite; }
  .cloudB { animation: cloud2 12s ease-in-out infinite; }
  .halo   { animation: sunPulse 3.4s ease-in-out infinite; }
</style>
