<script>
(function () {
  /* 地面虚线 0.75s 移动 160 单位，车轮与脚蹬按相同线速度同步 */
  const V = 160 / 0.75;
  const OMEGA = V / 90;                  // 角速度（轮径 90，1:1 传动）
  const B = { x: 600, y: 490 }, R = 45;  // 中轴与曲柄半径
  const H = { x: 572, y: 414 };          // 髋关节（车座处）
  const L1 = 62, L2 = 62;                // 大腿 / 小腿长度

  const wheelRear  = document.getElementById('wheelRear');
  const wheelFront = document.getElementById('wheelFront');
  const crank      = document.getElementById('crank');
  const pelican    = document.getElementById('pelican');
  const legNear    = document.getElementById('legNear');
  const legFar     = document.getElementById('legFar');

  let last = null, t = 0, bob = 0;

  function pedal(a) {
    return { x: B.x + R * Math.sin(a), y: B.y - R * Math.cos(a) };
  }

  /* 两段式 IK：髋 → 膝 → 踝 */
  function ik(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    const max = L1 + L2 - 2, d0 = Math.hypot(dx, dy);
    let d = d0;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    const ux = dx / d, uy = dy / d;
    return {
      knee: { x: hip.x + ux * a + uy * h, y: hip.y + uy * a - ux * h },
      foot: { x: hip.x + dx, y: hip.y + dy }
    };
  }

  function drawLeg(el, ang) {
    const p = pedal(ang);
    const res = ik(H, { x: p.x, y: p.y - bob });   // 脚点换算到鹈鹕局部坐标
    const k = res.knee, f = res.foot;
    el.setAttribute('d', 'M ' + H.x + ' ' + H.y +
      ' L ' + k.x.toFixed(1) + ' ' + k.y.toFixed(1) +
      ' L ' + f.x.toFixed(1) + ' ' + f.y.toFixed(1));
  }

  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    t += dt;

    const th = OMEGA * t;
    const deg = th * 180 / Math.PI;
    bob = 3.5 * Math.sin(2 * th);

    wheelRear.setAttribute('transform', 'translate(430 540) rotate(' + deg + ')');
    wheelFront.setAttribute('transform', 'translate(770 540) rotate(' + deg + ')');
    crank.setAttribute('transform', 'rotate(' + deg + ' 600 490)');
    pelican.setAttribute('transform', 'translate(0 ' + bob + ')');

    drawLeg(legNear, th);
    drawLeg(legFar, th + Math.PI);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
