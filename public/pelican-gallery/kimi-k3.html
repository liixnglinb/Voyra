<script>
// ===== 双腿踩踏板：两杆 IK（大腿+小腿），脚掌锁定在脚踏上 =====
const BB = { x: 388, y: 350 };   // 中轴（牙盘中心）
const R = 30;                    // 曲柄半径
const L1 = 66, L2 = 66;          // 大腿 / 小腿长度
const legs = [
  { hip: { x: 338, y: 252 }, phase: Math.PI, ids: ['tF', 'cF', 'fF', 'crF', 'pdF'] },
  { hip: { x: 350, y: 260 }, phase: 0,       ids: ['tN', 'cN', 'fN', 'crN', 'pdN'] }
];
const $ = id => document.getElementById(id);

function solveKnee(H, F) {
  let dx = F.x - H.x, dy = F.y - H.y;
  let d = Math.hypot(dx, dy);
  const max = L1 + L2 - 0.01;
  if (d > max) { const s = max / d; dx *= s; dy *= s; d = max; }
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
  const ux = dx / d, uy = dy / d;
  const k1 = { x: H.x + a * ux - uy * h, y: H.y + a * uy + ux * h };
  const k2 = { x: H.x + a * ux + uy * h, y: H.y + a * uy - ux * h };
  return k1.x > k2.x ? k1 : k2;   // 膝盖朝前
}

function tick(t) {
  const w = t / 1000 * 2 * Math.PI / 1.6;   // 踩踏周期 1.6s
  for (const L of legs) {
    const th = w + L.phase;
    const F = { x: BB.x + R * Math.cos(th), y: BB.y + R * Math.sin(th) };
    const K = solveKnee(L.hip, F);
    const [tE, cE, fE, crE, pdE] = L.ids.map($);
    tE.setAttribute('x2', K.x); tE.setAttribute('y2', K.y);
    cE.setAttribute('x1', K.x); cE.setAttribute('y1', K.y);
    cE.setAttribute('x2', F.x); cE.setAttribute('y2', F.y);
    fE.setAttribute('cx', F.x + 6); fE.setAttribute('cy', F.y - 2);
    crE.setAttribute('x2', F.x); crE.setAttribute('y2', F.y);
    pdE.setAttribute('x', F.x - 9); pdE.setAttribute('y', F.y - 3.5);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
