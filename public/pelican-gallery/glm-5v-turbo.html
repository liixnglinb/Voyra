<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 60%, #90EE90 60%, #228B22 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.scene-container {
  position: relative;
  width: 900px;
  height: 600px;
}
/* 轮子旋转动画 */
@keyframes wheelSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
/* 踏板转动 */
@keyframes pedalRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
/* 鹈鹕身体上下踩踏 */
@keyframes pelicanBob {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-3px); }
}
/* 鹈鹕腿部踩踏 */
@keyframes legPedal {
  0% { transform: rotate(-15deg); }
  50% { transform: rotate(15deg); }
  100% { transform: rotate(-15deg); }
}
/* 云朵飘动 */
@keyframes cloudDrift {
  0% { transform: translateX(0); }
  100% { transform: translateX(-950px); }
}
/* 地面滚动 */
@keyframes groundScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-200px); }
}
/* 太阳光芒 */
@keyframes sunPulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}
/* 鹈鹕翅膀拍动 */
@keyframes wingFlap {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-8deg); }
}
/* 喉囊晃动 */
@keyframes pouchSway {
  0%, 100% { transform: skewX(0deg); }
  25% { transform: skewX(3deg); }
  75% { transform: skewX(-3deg); }
}
.wheel { animation: wheelSpin 0.8s linear infinite; transform-origin: center; }
.pedal-group { animation: pedalRotate 0.8s linear infinite; transform-origin: center; }
.pelican-body { animation: pelicanBob 0.4s ease-in-out infinite; }
.pelican-leg { animation: legPedal 0.4s ease-in-out infinite; transform-origin: top center; }
.cloud { animation: cloudDrift 20s linear infinite; }
.ground-pattern { animation: groundScroll 2s linear infinite; }
.sun-glow { animation: sunPulse 3s ease-in-out infinite; transform-origin: center; }
.wing { animation: wingFlap 0.8s ease-in-out infinite; transform-origin: right center; }
.pouch { animation: pouchSway 0.8s ease-in-out infinite; transform-origin: top center; }
.title-bar {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.85);
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  color: #333;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.model-tag {
  color: #185FA5;
  font-weight: 500;
}
</style>
