      }

        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #286c70;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
      }

      .stage {
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: 8px;
        background: var(--sky);
        box-shadow: 12px 12px 0 #153f45;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        padding: 10px 2px 0;
        color: #eef4e6;
        font-size: 13px;
        letter-spacing: 0;
      }

      .caption strong {
        font-size: 16px;
        font-weight: 700;
      }

      .cloud-a {
        animation: drift-left 18s linear infinite;
      }

      .cloud-b {
        animation: drift-left 25s -10s linear infinite;
      }

      .road-lines {
        animation: road-scroll 0.72s linear infinite;
      }

      .wheel-inner {
        transform-box: fill-box;
        transform-origin: center;
        animation: wheel-spin 1.08s linear infinite;
      }

      .bike-bounce {
        animation: bike-bounce 0.54s ease-in-out infinite alternate;
      }

      .pelican-bob {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: pelican-bob 0.9s ease-in-out infinite alternate;
      }

      .wing {
        transform-box: fill-box;
        transform-origin: 100% 55%;
        animation: wing-pump 0.9s ease-in-out infinite alternate;
      }

      .tail-feathers {
        transform-box: fill-box;
        transform-origin: left center;
        animation: tail-flick 0.54s ease-in-out infinite alternate;
      }

      .leg-one,
      .leg-two {
        transform-box: fill-box;
      }

      .leg-one {
        transform-origin: 50% 0%;
        animation: pedal-one 1.08s linear infinite;
      }

      .leg-two {
        transform-origin: 50% 0%;
        animation: pedal-two 1.08s linear infinite;
      }

      .beak-tip {
        transform-box: fill-box;
        transform-origin: right center;
        animation: beak-nod 0.9s ease-in-out infinite alternate;
      }

      @keyframes drift-left {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-190px);
        }
      }

      @keyframes road-scroll {
        to {
          stroke-dashoffset: -92;
        }
      }

      @keyframes wheel-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bike-bounce {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(3px);
        }
      }

      @keyframes pelican-bob {
        from {
          transform: translateY(0) rotate(-1deg);
        }
        to {
          transform: translateY(-6px) rotate(1deg);
        }
      }

      @keyframes wing-pump {
        from {
          transform: rotate(-3deg);
        }
        to {
          transform: rotate(6deg);
        }
      }

      @keyframes tail-flick {
        from {
          transform: rotate(-3deg);
        }
        to {
          transform: rotate(5deg);
        }
      }

      @keyframes pedal-one {
        0%,
        100% {
          transform: rotate(-9deg);
        }
        50% {
          transform: rotate(12deg);
        }
      }

      @keyframes pedal-two {
        0%,
        100% {
          transform: rotate(12deg);
        }
        50% {
          transform: rotate(-9deg);
        }
      }

      @keyframes beak-nod {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (max-width: 560px) {
        main {
          width: calc(100vw - 20px);
        }

        .stage {
          border-width: 4px;
          box-shadow: 7px 7px 0 #153f45;
        }

        .caption {
          align-items: flex-start;
          flex-direction: column;
          gap: 2px;
          font-size: 12px;
        }

        .caption strong {
          font-size: 14px;
        }
      }
