<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 - Kimi-2.7-Code</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 60%, #FFF8DC 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 16px 28px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }

    .control-group input[type="range"] {
      width: 140px;
      accent-color: #FF6B35;
    }

    .model-tag {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="model-tag">Kimi-2.7-Code</div>

  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- 太阳光晕 -->
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFF7E6"/>
        <stop offset="60%" stop-color="#FFD700" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
      </radialGradient>

      <!-- 鹈鹕羽毛渐变 -->
      <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#E8E8E8"/>
      </linearGradient>

      <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F5F5F5"/>
        <stop offset="100%" stop-color="#D0D0D0"/>
      </linearGradient>

      <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#FFB347"/>
        <stop offset="50%" stop-color="#FF8C00"/>
        <stop offset="100%" stop-color="#FF6B35"/>
      </linearGradient>

      <!-- 自行车金属渐变 -->
      <linearGradient id="bikeFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ECDC4"/>
        <stop offset="100%" stop-color="#2A9D8F"/>
      </linearGradient>

      <!-- 地面渐变 -->
      <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#90EE90"/>
        <stop offset="100%" stop-color="#7FCD7F"/>
      </linearGradient>

      <!-- 云朵滤镜 -->
      <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
        <feOffset dx="0" dy="2" result="offsetblur"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.15"/>
        </feComponentTransfer>
        <feMerge>
          <feMergeNode in="offsetblur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- 轮胎纹理 -->
      <pattern id="tirePattern" width="20" height="10" patternUnits="userSpaceOnUse">
        <rect width="20" height="10" fill="#2C2C2C"/>
        <path d="M0,5 L20,5" stroke="#3D3D3D" stroke-width="2"/>
      </pattern>

      <!-- 单个辐条定义 -->
      <g id="spoke">
        <line x1="0" y1="-85" x2="0" y2="85" stroke="#C0C0C0" stroke-width="2"/>
      </g>
    </defs>

    <!-- 太阳 -->
    <g id="sunGroup" transform="translate(1000, 120)">
      <circle r="70" fill="url(#sunGlow)"/>
      <circle r="40" fill="#FFD700"/>
    </g>

    <!-- 远景云朵 -->
    <g id="cloudsBack"></g>

    <!-- 中景山丘 -->
    <g id="hills"></g>

    <!-- 近景树木与路灯 -->
    <g id="foreground"></g>

    <!-- 地面 -->
    <rect id="ground" x="-200" y="620" width="2000" height="200" fill="url(#groundGrad)"/>

    <!-- 路面 -->
    <rect id="road" x="-200" y="680" width="2000" height="120" fill="#6B6B6B"/>
    <line id="roadLine" x1="-200" y1="740" x2="2000" y2="740" stroke="#F0E68C" stroke-width="4" stroke-dasharray="40 40"/>

    <!-- 鹈鹕自行车组合 -->
    <g id="pelicanBike" transform="translate(450, 480)">
      <!-- 阴影 -->
      <ellipse cx="140" cy="230" rx="160" ry="20" fill="rgba(0,0,0,0.15)"/>

      <!-- 后车轮 -->
      <g id="rearWheel" transform="translate(0, 180)">
        <circle r="90" fill="none" stroke="#2C2C2C" stroke-width="16"/>
        <circle r="78" fill="none" stroke="#555" stroke-width="2"/>
        <circle r="82" fill="none" stroke="#3D3D3D" stroke-width="3" stroke-dasharray="8 4"/>
        <g id="rearSpokes"></g>
        <circle r="12" fill="#888"/>
        <circle r="6" fill="#CCC"/>
      </g>

      <!-- 前车轮 -->
      <g id="frontWheel" transform="translate(280, 180)">
        <circle r="90" fill="none" stroke="#2C2C2C" stroke-width="16"/>
        <circle r="78" fill="none" stroke="#555" stroke-width="2"/>
        <circle r="82" fill="none" stroke="#3D3D3D" stroke-width="3" stroke-dasharray="8 4"/>
        <g id="frontSpokes"></g>
        <circle r="12" fill="#888"/>
        <circle r="6" fill="#CCC"/>
      </g>

      <!-- 自行车车架 -->
      <g id="bikeFrame">
        <!-- 后三角 -->
        <path d="M0,180 L110,180 L60,80 Z" fill="none" stroke="url(#bikeFrameGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 主三角 -->
        <path d="M60,80 L110,180 L250,100 L240,70 Z" fill="none" stroke="url(#bikeFrameGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 前叉 -->
        <line x1="250" y1="100" x2="280" y2="180" stroke="url(#bikeFrameGrad)" stroke-width="10" stroke-linecap="round"/>
        <!-- 车把立管 -->
        <line x1="240" y1="70" x2="240" y2="35" stroke="url(#bikeFrameGrad)" stroke-width="8" stroke-linecap="round"/>
        <!-- 车把 -->
        <path d="M220,35 L260,35" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        <path d="M260,35 L265,25" stroke="#333" stroke-width="6" stroke-linecap="round"/>
        <!-- 座管 -->
        <line x1="60" y1="80" x2="50" y2="40" stroke="url(#bikeFrameGrad)" stroke-width="9" stroke-linecap="round"/>
        <!-- 车座 -->
        <path d="M35,40 Q50,30 65,40" stroke="#8B4513" stroke-width="12" stroke-linecap="round" fill="none"/>
        <!-- 链轮 -->
        <circle cx="110" cy="180" r="22" fill="#444" stroke="#666" stroke-width="3"/>
        <circle cx="110" cy="180" r="16" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
      </g>

      <!-- 踏板曲柄 -->
      <g id="crank" transform="translate(110, 180)">
        <line id="crankArmLeft" x1="0" y1="0" x2="0" y2="45" stroke="#666" stroke-width="8" stroke-linecap="round"/>
        <line id="crankArmRight" x1="0" y1="0" x2="0" y2="-45" stroke="#888" stroke-width="6" stroke-linecap="round"/>
        <rect id="pedalLeft" x="-14" y="38" width="28" height="12" rx="3" fill="#333"/>
        <rect id="pedalRight" x="-12" y="-50" width="24" height="10" rx="3" fill="#444"/>
      </g>

      <!-- 鹈鹕左腿（后侧） -->
      <g id="leftLeg">
        <line id="leftThigh" x1="80" y1="75" x2="110" y2="130" stroke="#E8967A" stroke-width="14" stroke-linecap="round"/>
        <line id="leftShin" x1="110" y1="130" x2="110" y2="180" stroke="#E8967A" stroke-width="12" stroke-linecap="round"/>
        <path id="leftFoot" d="M100,180 L125,180" stroke="#FF8C00" stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- 鹈鹕身体 -->
      <g id="pelicanBodyGroup">
        <!-- 尾巴羽毛 -->
        <path d="M20,70 Q-10,60 10,90 Q30,100 50,85" fill="#FFF" stroke="#DDD" stroke-width="2"/>
        <path d="M25,80 Q-5,75 15,100 Q35,105 55,95" fill="#F8F8F8" stroke="#DDD" stroke-width="2"/>

        <!-- 身体 -->
        <ellipse cx="110" cy="55" rx="85" ry="55" fill="url(#bodyGrad)"/>
        <!-- 翅膀 -->
        <path d="M60,45 Q90,20 140,40 Q155,55 140,75 Q90,85 50,70 Q35,55 60,45" fill="url(#wingGrad)" stroke="#CCC" stroke-width="2"/>
        <!-- 翅膀羽毛细节 -->
        <path d="M70,55 Q100,45 130,55" fill="none" stroke="#BBB" stroke-width="2"/>
        <path d="M75,65 Q105,55 125,65" fill="none" stroke="#BBB" stroke-width="2"/>

        <!-- 脖子 -->
        <path d="M165,55 Q185,55 190,25 Q195,-5 175,-15 Q155,-25 145,-5" fill="url(#bodyGrad)" stroke="#DDD" stroke-width="2"/>

        <!-- 头部 -->
        <ellipse cx="165" cy="-20" rx="35" ry="30" fill="url(#bodyGrad)"/>

        <!-- 巨大喙 -->
        <path d="M190,-20 Q240,-15 270,-5 Q280,0 270,8 Q240,15 195,5" fill="url(#beakGrad)" stroke="#E67E22" stroke-width="2"/>
        <path d="M195,5 Q230,12 260,8" fill="none" stroke="#D35400" stroke-width="2"/>
        <!-- 喙下喉囊 -->
        <path d="M185,0 Q200,25 195,40 Q180,45 170,20" fill="#FFDAB9" stroke="#E67E22" stroke-width="2"/>

        <!-- 眼睛 -->
        <circle cx="175" cy="-30" r="10" fill="#FFF" stroke="#333" stroke-width="2"/>
        <circle cx="178" cy="-30" r="5" fill="#000"/>
        <circle cx="180" cy="-32" r="2" fill="#FFF"/>
        <!-- 眼罩 -->
        <path d="M155,-40 Q175,-50 195,-38" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>

        <!-- 冠羽 -->
        <path d="M145,-35 Q135,-55 150,-45" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 鹈鹕右腿（前侧） -->
      <g id="rightLeg">
        <line id="rightThigh" x1="80" y1="75" x2="110" y2="130" stroke="#F4A460" stroke-width="14" stroke-linecap="round"/>
        <line id="rightShin" x1="110" y1="130" x2="110" y2="180" stroke="#F4A460" stroke-width="12" stroke-linecap="round"/>
        <path id="rightFoot" d="M100,180 L125,180" stroke="#FF7F00" stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- 翅膀前端羽毛 -->
      <g id="wingTips">
        <ellipse cx="50" cy="70" rx="8" ry="5" fill="#FFF" stroke="#CCC" stroke-width="1"/>
        <ellipse cx="45" cy="80" rx="8" ry="5" fill="#FFF" stroke="#CCC" stroke-width="1"/>
      </g>
    </g>

    <!-- 速度线 -->
    <g id="speedLines"></g>
  </svg>

  <div class="control-panel">
    <div class="control-group">
      <label for="speedRange">骑行速度</label>
      <input type="range" id="speedRange" min="0" max="3" step="0.1" value="1">
    </div>
    <div class="control-group">
      <label for="bobRange">颠簸幅度</label>
      <input type="range" id="bobRange" min="0" max="2" step="0.1" value="1">
    </div>
  </div>

  <script>
    (function() {
      // 配置
      const CONFIG = {
        baseSpeed: 4,
        wheelRadius: 90,
        crankLength: 45,
        hipX: 80,
        hipY: 75,
        kneeRestLength: 60,
        shinLength: 60,
        cloudCount: 6,
        hillCount: 4,
        treeCount: 5,
        speedLineCount: 8
      };

      // DOM 元素
      const scene = document.getElementById('scene');
      const rearWheel = document.getElementById('rearWheel');
      const frontWheel = document.getElementById('frontWheel');
      const rearSpokes = document.getElementById('rearSpokes');
      const frontSpokes = document.getElementById('frontSpokes');
      const crank = document.getElementById('crank');
      const pelicanBodyGroup = document.getElementById('pelicanBodyGroup');
      const leftThigh = document.getElementById('leftThigh');
      const leftShin = document.getElementById('leftShin');
      const leftFoot = document.getElementById('leftFoot');
      const rightThigh = document.getElementById('rightThigh');
      const rightShin = document.getElementById('rightShin');
      const rightFoot = document.getElementById('rightFoot');
      const cloudsBack = document.getElementById('cloudsBack');
      const hills = document.getElementById('hills');
      const foreground = document.getElementById('foreground');
      const roadLine = document.getElementById('roadLine');
      const speedLines = document.getElementById('speedLines');
      const speedRange = document.getElementById('speedRange');
      const bobRange = document.getElementById('bobRange');

      let speedMultiplier = 1;
      let bobMultiplier = 1;
      let globalTime = 0;
      let wheelAngle = 0;
      let crankAngle = 0;

      // 生成辐条
      function createSpokes(container, count) {
        for (let i = 0; i < count; i++) {
          const angle = (360 / count) * i;
          const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#spoke');
          use.setAttribute('transform', `rotate(${angle})`);
          container.appendChild(use);
        }
      }
      createSpokes(rearSpokes, 12);
      createSpokes(frontSpokes, 12);

      // 生成云朵
      function createCloud(x, y, scale, opacity) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${x}, ${y}) scale(${scale})`);
        g.setAttribute('opacity', opacity);
        g.setAttribute('filter', 'url(#cloudShadow)');
        g.innerHTML = `
          <circle cx="0" cy="0" r="30" fill="#FFF"/>
          <circle cx="40" cy="-10" r="40" fill="#FFF"/>
          <circle cx="85" cy="0" r="30" fill="#FFF"/>
          <circle cx="45" cy="15" r="25" fill="#FFF"/>
        `;
        return g;
      }

      const clouds = [];
      for (let i = 0; i < CONFIG.cloudCount; i++) {
        const cloud = {
          el: createCloud(
            200 + i * 220 + Math.random() * 100,
            80 + Math.random() * 120,
            0.8 + Math.random() * 0.7,
            0.7 + Math.random() * 0.2
          ),
          x: 200 + i * 220 + Math.random() * 100,
          y: 80 + Math.random() * 120,
          scale: 0.8 + Math.random() * 0.7,
          speed: 0.3 + Math.random() * 0.4
        };
        cloudsBack.appendChild(cloud.el);
        clouds.push(cloud);
      }

      // 生成山丘
      function createHill(x, width, height, color) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${x},620 Q${x + width / 2},${620 - height} ${x + width},620 Z`);
        path.setAttribute('fill', color);
        return { el: path, x, width, speed: 0.6 };
      }

      const hillItems = [];
      const hillColors = ['#98D98E', '#7BC47B', '#6ABF6A', '#5CB85C'];
      for (let i = 0; i < CONFIG.hillCount; i++) {
        const width = 500 + Math.random() * 300;
        const height = 120 + Math.random() * 100;
        const hill = createHill(i * 350 - 200, width, height, hillColors[i % hillColors.length]);
        hills.appendChild(hill.el);
        hillItems.push(hill);
      }

      // 生成前景树木/路灯
      function createTree(x) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const type = Math.random() > 0.5 ? 'tree' : 'lamp';
        if (type === 'tree') {
          g.innerHTML = `
            <rect x="-8" y="0" width="16" height="80" fill="#8B4513"/>
            <circle cx="0" cy="-20" r="45" fill="#228B22"/>
            <circle cx="-25" cy="-10" r="30" fill="#32CD32"/>
            <circle cx="25" cy="-10" r="30" fill="#2E8B57"/>
            <circle cx="0" cy="-55" r="25" fill="#32CD32"/>
          `;
        } else {
          g.innerHTML = `
            <rect x="-6" y="0" width="12" height="120" fill="#696969"/>
            <circle cx="0" cy="-90" r="18" fill="#FFD700" fill-opacity="0.8"/>
            <path d="M-20,-80 L20,-80 L0,-110 Z" fill="#696969"/>
          `;
        }
        g.setAttribute('transform', `translate(${x}, ${600 + (type === 'lamp' ? 20 : 0)})`);
        return { el: g, x, speed: type === 'lamp' ? 2.2 : 2, type };
      }

      const fgItems = [];
      for (let i = 0; i < CONFIG.treeCount; i++) {
        const item = createTree(300 + i * 350 + Math.random() * 100);
        foreground.appendChild(item.el);
        fgItems.push(item);
      }

      // 生成速度线
      const lines = [];
      for (let i = 0; i < CONFIG.speedLineCount; i++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', '#FFF');
        line.setAttribute('stroke-width', '2');
        line.setAttribute('stroke-opacity', '0.4');
        line.setAttribute('stroke-linecap', 'round');
        speedLines.appendChild(line);
        lines.push({
          el: line,
          x: Math.random() * 1200,
          y: 300 + Math.random() * 350,
          length: 30 + Math.random() * 70,
          speed: 6 + Math.random() * 8
        });
      }

      // 逆向运动学计算腿部
      function solveLeg(hipX, hipY, pedalX, pedalY, thighLen, shinLen, isRight) {
        const dx = pedalX - hipX;
        const dy = pedalY - hipY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // 限制最大距离
        const maxLen = thighLen + shinLen - 2;
        const clampedDist = Math.min(dist, maxLen);
        const ratio = clampedDist / Math.max(dist, 0.001);
        const targetX = hipX + dx * ratio;
        const targetY = hipY + dy * ratio;

        // 余弦定理求膝关节角度
        const cosKnee = (thighLen * thighLen + shinLen * shinLen - clampedDist * clampedDist) /
                        (2 * thighLen * shinLen);
        const kneeAngle = Math.acos(Math.max(-1, Math.min(1, cosKnee)));

        // 求髋关节到踏板连线的角度
        const baseAngle = Math.atan2(targetY - hipY, targetX - hipX);

        // 余弦定理求髋关节处的偏角
        const cosHip = (thighLen * thighLen + clampedDist * clampedDist - shinLen * shinLen) /
                       (2 * thighLen * clampedDist);
        const hipOffset = Math.acos(Math.max(-1, Math.min(1, cosHip)));

        // 右腿膝盖朝前，左腿膝盖略微朝后，形成自然踩踏
        const kneeDir = isRight ? -1 : 1;
        const kneeAngleAbs = baseAngle + kneeDir * hipOffset;

        const kneeX = hipX + thighLen * Math.cos(kneeAngleAbs);
        const kneeY = hipY + thighLen * Math.sin(kneeAngleAbs);

        return { kneeX, kneeY, pedalX: targetX, pedalY: targetY };
      }

      function updateLegs(crankAngleRad) {
        const hipX = CONFIG.hipX;
        const hipY = CONFIG.hipY;

        // 左腿踏板位置（与曲柄同相，但视觉上在后方）
        const leftPedalX = 110 + CONFIG.crankLength * Math.cos(crankAngleRad);
        const leftPedalY = 180 + CONFIG.crankLength * Math.sin(crankAngleRad);

        // 右腿踏板位置（相位差 180°）
        const rightPedalX = 110 + CONFIG.crankLength * Math.cos(crankAngleRad + Math.PI);
        const rightPedalY = 180 + CONFIG.crankLength * Math.sin(crankAngleRad + Math.PI);

        const leftLeg = solveLeg(hipX, hipY, leftPedalX, leftPedalY, CONFIG.kneeRestLength, CONFIG.shinLength, false);
        const rightLeg = solveLeg(hipX, hipY, rightPedalX, rightPedalY, CONFIG.kneeRestLength, CONFIG.shinLength, true);

        // 更新左腿
        leftThigh.setAttribute('x1', hipX);
        leftThigh.setAttribute('y1', hipY);
        leftThigh.setAttribute('x2', leftLeg.kneeX);
        leftThigh.setAttribute('y2', leftLeg.kneeY);
        leftShin.setAttribute('x1', leftLeg.kneeX);
        leftShin.setAttribute('y1', leftLeg.kneeY);
        leftShin.setAttribute('x2', leftLeg.pedalX);
        leftShin.setAttribute('y2', leftLeg.pedalY);
        leftFoot.setAttribute('d', `M${leftLeg.pedalX - 12},${leftLeg.pedalY + 4} L${leftLeg.pedalX + 12},${leftLeg.pedalY + 4}`);

        // 更新右腿
        rightThigh.setAttribute('x1', hipX);
        rightThigh.setAttribute('y1', hipY);
        rightThigh.setAttribute('x2', rightLeg.kneeX);
        rightThigh.setAttribute('y2', rightLeg.kneeY);
        rightShin.setAttribute('x1', rightLeg.kneeX);
        rightShin.setAttribute('y1', rightLeg.kneeY);
        rightShin.setAttribute('x2', rightLeg.pedalX);
        rightShin.setAttribute('y2', rightLeg.pedalY);
        rightFoot.setAttribute('d', `M${rightLeg.pedalX - 12},${rightLeg.pedalY + 4} L${rightLeg.pedalX + 12},${rightLeg.pedalY + 4}`);
      }

      function updateBackground() {
        // 云朵
        clouds.forEach(cloud => {
          cloud.x -= cloud.speed * speedMultiplier;
          if (cloud.x < -150) {
            cloud.x = 1300 + Math.random() * 200;
            cloud.y = 80 + Math.random() * 120;
          }
          cloud.el.setAttribute('transform', `translate(${cloud.x}, ${cloud.y}) scale(${cloud.scale})`);
        });

        // 山丘
        hillItems.forEach(hill => {
          hill.x -= hill.speed * speedMultiplier;
          if (hill.x + hill.width < -100) {
            hill.x = 1300;
          }
          hill.el.setAttribute('d', `M${hill.x},620 Q${hill.x + hill.width / 2},${620 - (hill.width > 600 ? 150 : 100)} ${hill.x + hill.width},620 Z`);
        });

        // 前景
        fgItems.forEach(item => {
          item.x -= item.speed * speedMultiplier;
          if (item.x < -100) {
            item.x = 1300 + Math.random() * 200;
            // 重新随机类型
            if (Math.random() > 0.5) {
              item.el.innerHTML = `
                <rect x="-8" y="0" width="16" height="80" fill="#8B4513"/>
                <circle cx="0" cy="-20" r="45" fill="#228B22"/>
                <circle cx="-25" cy="-10" r="30" fill="#32CD32"/>
                <circle cx="25" cy="-10" r="30" fill="#2E8B57"/>
                <circle cx="0" cy="-55" r="25" fill="#32CD32"/>
              `;
              item.el.setAttribute('transform', `translate(${item.x}, 600)`);
              item.type = 'tree';
            } else {
              item.el.innerHTML = `
                <rect x="-6" y="0" width="12" height="120" fill="#696969"/>
                <circle cx="0" cy="-90" r="18" fill="#FFD700" fill-opacity="0.8"/>
                <path d="M-20,-80 L20,-80 L0,-110 Z" fill="#696969"/>
              `;
              item.el.setAttribute('transform', `translate(${item.x}, 620)`);
              item.type = 'lamp';
            }
          } else {
            const y = item.type === 'lamp' ? 620 : 600;
            item.el.setAttribute('transform', `translate(${item.x}, ${y})`);
          }
        });

        // 路面虚线滚动
        const dashOffset = (globalTime * CONFIG.baseSpeed * speedMultiplier * 3) % 80;
        roadLine.setAttribute('stroke-dashoffset', -dashOffset);
      }

      function updateSpeedLines() {
        lines.forEach(line => {
          line.x -= line.speed * speedMultiplier;
          if (line.x + line.length < 0) {
            line.x = 1200 + Math.random() * 300;
            line.y = 300 + Math.random() * 350;
            line.length = 30 + Math.random() * 70;
          }
          line.el.setAttribute('x1', line.x);
          line.el.setAttribute('y1', line.y);
          line.el.setAttribute('x2', line.x + line.length);
          line.el.setAttribute('y2', line.y);
          line.el.setAttribute('stroke-opacity', (0.2 + Math.random() * 0.3) * speedMultiplier);
        });
      }

      function animate() {
        const dt = 1;
        globalTime += dt;

        // 更新速度倍数
        speedMultiplier = parseFloat(speedRange.value);
        bobMultiplier = parseFloat(bobRange.value);

        // 车轮旋转
        wheelAngle += CONFIG.baseSpeed * speedMultiplier;
        rearWheel.setAttribute('transform', `translate(0, 180) rotate(${wheelAngle})`);
        frontWheel.setAttribute('transform', `translate(280, 180) rotate(${wheelAngle})`);

        // 曲柄旋转
        crankAngle += CONFIG.baseSpeed * speedMultiplier;
        const crankAngleRad = (crankAngle * Math.PI) / 180;
        crank.setAttribute('transform', `translate(110, 180) rotate(${crankAngle})`);

        // 身体颠簸
        const bobY = Math.sin(globalTime * 0.15) * 3 * bobMultiplier;
        const bobRot = Math.sin(globalTime * 0.12) * 1.5 * bobMultiplier;
        pelicanBodyGroup.setAttribute('transform', `translate(0, ${bobY}) rotate(${bobRot}, 110, 55)`);

        // 更新腿部 IK
        updateLegs(crankAngleRad);

        // 更新背景
        updateBackground();

        // 更新速度线
        updateSpeedLines();

        requestAnimationFrame(animate);
      }

      // 交互：点击画面可短暂加速
      scene.addEventListener('click', () => {
        const originalSpeed = speedRange.value;
        speedRange.value = Math.min(3, parseFloat(originalSpeed) + 0.5);
        setTimeout(() => {
          speedRange.value = originalSpeed;
        }, 800);
      });

      // 启动动画
      animate();
    })();
  </script>
</body>
</html>
