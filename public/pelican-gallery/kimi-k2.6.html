    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F6FF 50%, #98FB98 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.1));
        }

        /* 云朵飘动 */
        .cloud {
            animation: float linear infinite;
        }
        .cloud1 { animation-duration: 25s; }
        .cloud2 { animation-duration: 30s; animation-delay: -10s; }
        .cloud3 { animation-duration: 20s; animation-delay: -5s; }

        @keyframes float {
            from { transform: translateX(-200px); }
            to { transform: translateX(1000px); }
        }

        /* 路面移动 */
        .road-line {
            animation: roadMove 1s linear infinite;
        }

        @keyframes roadMove {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -40; }
        }

        /* 车轮旋转 */
        .wheel {
            animation: spin 1s linear infinite;
            transform-origin: center;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 踏板旋转 */
        .pedal-assembly {
            animation: spin 1s linear infinite;
            transform-origin: 380px 320px;
        }

        /* 鹈鹕身体上下颠簸 */
        .pelican-body {
            animation: bounce 0.5s ease-in-out infinite alternate;
            transform-origin: 380px 280px;
        }

        @keyframes bounce {
            from { transform: translateY(0px) rotate(-1deg); }
            to { transform: translateY(-3px) rotate(1deg); }
        }

        /* 翅膀扇动 */
        .wing {
            animation: flap 0.8s ease-in-out infinite alternate;
            transform-origin: 360px 200px;
        }

        @keyframes flap {
            from { transform: rotate(0deg); }
            to { transform: rotate(-15deg); }
        }

        /* 脚蹬动画 */
        .left-leg {
            animation: leftPedal 1s linear infinite;
            transform-origin: 380px 320px;
        }

        .right-leg {
            animation: rightPedal 1s linear infinite;
            transform-origin: 380px 320px;
        }

        @keyframes leftPedal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rightPedal {
            from { transform: rotate(180deg); }
            to { transform: rotate(540deg); }
        }

        /* 树木移动 */
        .tree {
            animation: treeMove 4s linear infinite;
        }

        @keyframes treeMove {
            from { transform: translateX(0); }
            to { transform: translateX(-900px); }
        }

        /* 太阳光芒 */
        .sun-ray {
            animation: sunPulse 3s ease-in-out infinite;
            transform-origin: 750px 80px;
        }

        @keyframes sunPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* 信息面板 */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .info-panel strong {
            color: #2c5aa0;
        }
    </style>
</head>

    <script>
        // 添加一些简单的交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.scene-container');
            
            // 点击场景加速
            let speedMultiplier = 1;
            container.addEventListener('click', function() {
                speedMultiplier = speedMultiplier === 1 ? 2 : 1;
                
                // 更新所有动画速度
                const wheels = document.querySelectorAll('.wheel');
                const pedals = document.querySelector('.pedal-assembly');
                const legs = document.querySelectorAll('.left-leg, .right-leg');
                const roadLines = document.querySelector('.road-line');
                const trees = document.querySelector('.tree');
                
                const duration = speedMultiplier === 2 ? '0.5s' : '1s';
                const roadDuration = speedMultiplier === 2 ? '0.5s' : '1s';
                const treeDuration = speedMultiplier === 2 ? '2s' : '4s';
                
                wheels.forEach(wheel => wheel.style.animationDuration = duration);
                if (pedals) pedals.style.animationDuration = duration;
                legs.forEach(leg => leg.style.animationDuration = duration);
                if (roadLines) roadLines.style.animationDuration = roadDuration;
                if (trees) trees.style.animationDuration = treeDuration;
            });

            // 鼠标移动视差效果
            document.addEventListener('mousemove', function(e) {
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                const clouds = document.querySelectorAll('.cloud');
                clouds.forEach((cloud, index) => {
                    const offset = (index + 1) * 5;
                    cloud.style.transform = `translateX(${mouseX * offset}px)`;
                });
            });
        });
    </script>
